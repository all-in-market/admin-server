spring:
  application:
    name: all-in-market
  sql:
    init:
      mode: always
  datasource: # 환경 변수가 설정되어 있으면 그 값을 쓰고, 없으면 기본값을 쓴다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:allinmarket}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000} # 1시간

admin:
  email: ${ADMIN_ID}
  password: ${ADMIN_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8081

notification:
  auth:
    client-id: ${CUSTOMER_SERVER}
    secret: ${SERVER_SECRET_KEY}