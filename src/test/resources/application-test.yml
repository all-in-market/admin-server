spring:
  main:
    allow-bean-definition-overriding: true
  data:
    redis:
      repositories:
        enabled: false
  sql:
    init:
      mode: never  # 테스트 시 SQL 초기화 스크립트 실행 안 함
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1  # 인메모리 H2 DB, MySQL 호환 모드
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop  # 테스트 시작 시 테이블 생성, 종료 시 삭제
    show-sql: false
    defer-datasource-initialization: false

jwt:
  secret: test-only-jwt-secret-key-longer-than-32-bytes
  expiration: 86400000  # 토큰 만료 시간 (단위: ms, 86400000 = 24시간)

app:
  init:
    admin:
      enabled: true

notification-server:
  url: http://localhost:8083

notification:
  auth:
    client-id: mock-customer-server
    secret: Z9OSOWEIkhqMOG3veTR3xgkXOzbogWFGF0MnJTXOk66 # 테스트 전용 고정값